worker_processes auto;
# /run gets a fresh tmpfs mount at container start (not build time), so a
# non-root "nginx" user can't write there — the pid file goes to /tmp
# instead, which stays writable.
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # SPA — every unmatched path falls back to index.html so React
        # Router's client-side routes (e.g. /character/:id) work on a
        # hard refresh, not just via in-app navigation.
        location / {
            try_files $uri $uri/ /index.html;
        }

        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
