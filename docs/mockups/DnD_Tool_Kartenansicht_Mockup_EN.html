<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DnD Session Manager — Map Viewer Mockup</title>
<style>
  :root {
    --bg: #F1EDE2;
    --surface: #E6DFCC;
    --surface-2: #DCD3B8;
    --border: #C9BFA0;
    --primary: #927355;
    --primary-dark: #6E5540;
    --text: #1D1A10;
    --text-muted: #6B5D4A;
    --secondary: #4A5A42;
    --tertiary: #B08D4C;
    --error: #8C4A35;
    --sold-out: #A79C87;

    --font-display: Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', serif;
    --font-body: 'Iowan Old Style', Palatino, 'Palatino Linotype', Georgia, serif;
    --font-data: 'Courier New', Courier, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  header {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
    padding: 14px 24px;
    border-bottom: 2px solid var(--primary);
    background: var(--surface);
  }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand .glyph { font-family: var(--font-display); font-size: 22px; color: var(--primary); transform: rotate(-6deg); display: inline-block; }
  .brand h1 { font-family: var(--font-display); font-size: 18px; letter-spacing: 0.04em; margin: 0; font-weight: normal; }

  .header-right { display: flex; align-items: center; gap: 10px; }
  .back-link {
    font-family: var(--font-body); font-size: 13px; background: var(--bg); border: 1px solid var(--border);
    border-radius: 14px; padding: 6px 12px; color: var(--text); text-decoration: none;
  }

  /* Custom dropdown */
  .custom-select { position: relative; }
  .custom-select-trigger {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    font-family: var(--font-body); font-size: 13px; border: 1px solid var(--border); border-radius: 14px;
    padding: 6px 12px; background: var(--bg); color: var(--text); cursor: pointer; touch-action: manipulation;
  }
  .custom-select-trigger:hover { border-color: var(--primary); }
  .custom-select.open .custom-select-trigger { border-color: var(--primary); }
  .custom-select-trigger .cs-arrow { color: var(--text-muted); font-size: 9px; transition: transform 0.15s; }
  .custom-select.open .cs-arrow { transform: rotate(180deg); }
  .custom-select-menu {
    display: none; position: absolute; top: calc(100% + 5px); left: 0; min-width: 100%; z-index: 45;
    background: var(--surface); border: 1px solid var(--primary); border-radius: 8px;
    box-shadow: 0 10px 24px rgba(29,26,16,0.25); overflow: hidden;
  }
  .custom-select.open .custom-select-menu { display: block; }
  .cs-option { padding: 9px 14px; font-size: 13px; cursor: pointer; touch-action: manipulation; white-space: nowrap; }
  .cs-option:hover { background: var(--bg); }
  .cs-option.selected { background: rgba(146,115,85,0.16); font-weight: bold; color: var(--primary-dark); }

  .viewer-wrap {
    position: relative;
    flex: 1;
    overflow: hidden;
    background:
      repeating-linear-gradient(0deg, rgba(146,115,85,0.06) 0, rgba(146,115,85,0.06) 1px, transparent 1px, transparent 28px),
      repeating-linear-gradient(90deg, rgba(146,115,85,0.06) 0, rgba(146,115,85,0.06) 1px, transparent 1px, transparent 28px),
      var(--bg);
  }

  #mapViewport {
    position: absolute; inset: 0;
    overflow: hidden;
    cursor: grab;
    touch-action: none;
  }
  #mapViewport.dragging { cursor: grabbing; }

  #mapLayer {
    position: absolute;
    top: 50%; left: 50%;
    width: 1400px; height: 1000px;
    margin-left: -700px; margin-top: -500px;
    transform-origin: center center;
    transition: transform 0.06s linear;
    will-change: transform;
  }
  #mapLayer svg { width: 100%; height: 100%; display: block; }

  .controls {
    position: absolute; bottom: 18px; right: 18px;
    display: flex; flex-direction: column; gap: 8px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 8px;
    box-shadow: 0 4px 14px rgba(29,26,16,0.15);
  }
  .controls button {
    width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--primary);
    background: var(--bg); color: var(--primary-dark); font-family: var(--font-data); font-size: 18px;
    cursor: pointer; touch-action: manipulation; display: flex; align-items: center; justify-content: center; padding: 0;
  }
  .controls button:active { background: var(--primary); color: var(--bg); }
  .zoom-label {
    text-align: center; font-family: var(--font-data); font-size: 11px; color: var(--text-muted);
  }
  .controls .reset-btn { font-family: var(--font-body); font-size: 11px; width: 40px; height: 34px; }

  .hint {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    font-size: 11.5px; color: var(--text-muted); background: var(--surface);
    border: 1px solid var(--border); border-radius: 14px; padding: 6px 14px;
    pointer-events: none; opacity: 0.9;
  }

  .share-status {
    position: absolute; top: 14px; right: 18px;
    display: flex; gap: 6px; flex-wrap: wrap; max-width: 220px; justify-content: flex-end;
  }
  .share-status .chip {
    font-size: 10.5px; padding: 3px 9px; border-radius: 10px;
    border: 1px solid var(--secondary); color: var(--secondary); background: var(--bg);
  }
  .share-status .chip.off { border-color: var(--sold-out); color: var(--sold-out); }

  footer { text-align: center; font-size: 11px; color: var(--text-muted); padding: 8px 20px; font-style: italic; background: var(--surface); border-top: 1px solid var(--border); }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="glyph">&#9876;</span>
    <h1>Map Viewer — <span id="mapTitle">Throne Room</span></h1>
  </div>
  <div class="header-right">
    <div class="custom-select" id="roomSelect">
      <button class="custom-select-trigger" onclick="toggleCustomSelect(this)">
        <span id="roomSelectLabel">Throne Room</span><span class="cs-arrow">&#9662;</span>
      </button>
      <div class="custom-select-menu">
        <div class="cs-option" onclick="pickRoom('Entrance Hall', this)">Entrance Hall</div>
        <div class="cs-option" onclick="pickRoom('East Corridor', this)">East Corridor</div>
        <div class="cs-option selected" onclick="pickRoom('Throne Room', this)">Throne Room</div>
      </div>
    </div>
    <a class="back-link" href="DnD_Tool_Board_Mockup_EN.html">&larr; Back to Board</a>
  </div>
</header>

<div class="viewer-wrap">
  <div id="mapViewport">
    <div id="mapLayer">
      <svg viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg">
        <rect x="0" y="0" width="1400" height="1000" fill="#EFE6CE"/>
        <!-- Room outline -->
        <rect x="120" y="120" width="1160" height="760" rx="14" fill="#E4D8B8" stroke="#927355" stroke-width="6"/>
        <!-- Columns -->
        <g fill="#C9BFA0" stroke="#927355" stroke-width="2">
          <circle cx="280" cy="220" r="22"/>
          <circle cx="280" cy="880" r="0"/>
          <circle cx="500" cy="220" r="22"/>
          <circle cx="500" cy="780" r="22"/>
          <circle cx="900" cy="220" r="22"/>
          <circle cx="900" cy="780" r="22"/>
          <circle cx="1120" cy="220" r="22"/>
          <circle cx="1120" cy="780" r="22"/>
          <circle cx="280" cy="780" r="22"/>
        </g>
        <!-- Throne -->
        <g>
          <rect x="650" y="160" width="100" height="130" rx="8" fill="#B08D4C" stroke="#6E5540" stroke-width="4"/>
          <rect x="670" y="140" width="60" height="30" rx="4" fill="#B08D4C" stroke="#6E5540" stroke-width="4"/>
          <text x="700" y="330" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#6E5540">Throne</text>
        </g>
        <!-- Carpet -->
        <rect x="640" y="330" width="120" height="500" fill="#8C4A35" opacity="0.35"/>
        <!-- Hidden trapdoor (Perception DC 15) -->
        <g>
          <rect x="660" y="760" width="80" height="60" rx="4" fill="none" stroke="#4A5A42" stroke-width="3" stroke-dasharray="6 5"/>
          <text x="700" y="845" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#4A5A42">Trapdoor (DC 15)</text>
        </g>
        <!-- Doors to neighboring rooms -->
        <g stroke="#6E5540" stroke-width="6">
          <line x1="120" y1="480" x2="60" y2="480"/>
          <line x1="1280" y1="480" x2="1340" y2="480"/>
        </g>
        <text x="40" y="460" font-family="Georgia, serif" font-size="16" fill="#6E5540" text-anchor="end">East Corridor</text>
        <text x="1360" y="460" font-family="Georgia, serif" font-size="16" fill="#6E5540">Undercroft (unexplored)</text>

        <!-- Compass rose -->
        <g transform="translate(1220,900)" fill="#927355" opacity="0.6">
          <circle r="34" fill="none" stroke="#927355" stroke-width="2"/>
          <path d="M0,-28 L8,0 L0,28 L-8,0 Z"/>
          <text x="0" y="-40" text-anchor="middle" font-family="Georgia, serif" font-size="14">N</text>
        </g>

        <text x="700" y="90" text-anchor="middle" font-family="Georgia, serif" font-size="30" fill="#6E5540" letter-spacing="2">Throne Room</text>
      </svg>
    </div>
  </div>

  <div class="hint">Drag to pan · Scroll wheel / pinch gesture to zoom</div>
  <div class="share-status" id="shareStatus">
    <span class="chip">Rhogar</span><span class="chip">Elandra</span><span class="chip off">Torvin</span>
  </div>

  <div class="controls">
    <button onclick="zoomButton(1.25)" title="Zoom in">+</button>
    <div class="zoom-label" id="zoomLabel">100%</div>
    <button onclick="zoomButton(0.8)" title="Zoom out">−</button>
    <button class="reset-btn" onclick="resetView()" title="Reset">Reset</button>
  </div>
</div>

<footer>Mockup — Map viewer with zoom &amp; pan · works with mouse, trackpad, or touch, no device detection needed · illustrative only</footer>

<script>
let scale = 1, translateX = 0, translateY = 0;
const pointers = new Map();
let isDragging = false;
let dragStart = { x: 0, y: 0 };
let startTranslate = { x: 0, y: 0 };
let lastPinchDist = null;

const viewport = document.getElementById('mapViewport');
const layer = document.getElementById('mapLayer');

function applyTransform() {
  layer.style.transform = 'translate(' + translateX + 'px, ' + translateY + 'px) scale(' + scale + ')';
  document.getElementById('zoomLabel').textContent = Math.round(scale * 100) + '%';
}

function getDistance() {
  const pts = Array.from(pointers.values());
  const dx = pts[0].x - pts[1].x;
  const dy = pts[0].y - pts[1].y;
  return Math.sqrt(dx * dx + dy * dy);
}

viewport.addEventListener('pointerdown', function (e) {
  viewport.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1) {
    isDragging = true;
    viewport.classList.add('dragging');
    dragStart = { x: e.clientX, y: e.clientY };
    startTranslate = { x: translateX, y: translateY };
  } else if (pointers.size === 2) {
    isDragging = false;
    lastPinchDist = getDistance();
  }
});

viewport.addEventListener('pointermove', function (e) {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1 && isDragging) {
    translateX = startTranslate.x + (e.clientX - dragStart.x);
    translateY = startTranslate.y + (e.clientY - dragStart.y);
    applyTransform();
  } else if (pointers.size === 2) {
    const dist = getDistance();
    if (lastPinchDist) {
      zoomBy(dist / lastPinchDist);
    }
    lastPinchDist = dist;
  }
});

function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) lastPinchDist = null;
  if (pointers.size === 0) {
    isDragging = false;
    viewport.classList.remove('dragging');
  }
}
viewport.addEventListener('pointerup', endPointer);
viewport.addEventListener('pointercancel', endPointer);
viewport.addEventListener('pointerleave', endPointer);

viewport.addEventListener('wheel', function (e) {
  e.preventDefault();
  zoomBy(e.deltaY < 0 ? 1.12 : 0.89);
}, { passive: false });

function zoomBy(factor) {
  scale = Math.min(4, Math.max(0.4, scale * factor));
  applyTransform();
}

function zoomButton(factor) { zoomBy(factor); }

function resetView() {
  scale = 1; translateX = 0; translateY = 0;
  applyTransform();
}

/* Custom dropdown */
function toggleCustomSelect(triggerBtn) {
  const wrap = triggerBtn.closest('.custom-select');
  const wasOpen = wrap.classList.contains('open');
  document.querySelectorAll('.custom-select.open').forEach(function (cs) { cs.classList.remove('open'); });
  if (!wasOpen) wrap.classList.add('open');
}
document.addEventListener('click', function (e) {
  if (!e.target.closest('.custom-select')) {
    document.querySelectorAll('.custom-select.open').forEach(function (cs) { cs.classList.remove('open'); });
  }
});

function pickRoom(name, optionEl) {
  const menu = optionEl.closest('.custom-select-menu');
  menu.querySelectorAll('.cs-option').forEach(function (o) { o.classList.remove('selected'); });
  optionEl.classList.add('selected');
  document.getElementById('roomSelectLabel').textContent = name;
  document.getElementById('roomSelect').classList.remove('open');
  switchRoom(name);
}

function switchRoom(name) {
  document.getElementById('mapTitle').textContent = name;
  resetView();
}

applyTransform();
</script>

</body>
</html>
